esphome:
  name: robotea
  friendly_name: RoboTea

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: arduino

web_server:
  port: 80

# Enable logging
logger:
  level: INFO
  logs:
    component: INFO
    caysever_robotea: INFO


# Enable Home Assistant API
api:
  encryption:
    key: "api_encryption" # !!!DEĞİŞTİR!!!

ota:
  - platform: esphome
    password: "ota_password" # !!!DEĞİŞTİR!!!
    # Güncelleme sırasında ana döngü durur; o sırada röle açık kalırsa sıcaklık denetlenmez. Güncelleme başlar
    # başlamaz ısıtma, demleme ve aktif mod kapatılır.
    on_begin:
      then:
        - lambda: |-
            id(caysever).set_mode(caysever_robotea::MODE_KAPALI, 0);
            id(caysever).reset_all_operations(true);

# WiFi parolasını girin!
wifi:
  ssid: "My WiFi Name" # !!!DEĞİŞTİR!!!
  password: "My WiFi Password" # !!!DEĞİŞTİR!!!

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "RoboTea"
    password: "ap_password" # !!!DEĞİŞTİR!!!

captive_portal:

external_components:
  - source: github://omerfaruk-aran/caysever_robotea@main
    components: [caysever_robotea]
    refresh: 0s

caysever_robotea:
  id: caysever
  sensor: ntc_temperature
  kettle_state_sensor:
    name: "Kettle Durumu"
  mode_state_sensor:
    name: "Mod Durumu"
  active_mode_sensor:
    name: "Aktif Mod"
  cay_tazelik_sensor:
    name: "Çay Tazeliği"
  cay_tazelik_kalan_sensor:
    name: "Çay Tazeliği Kalan"
  mama_suyu_switch:
    name: Mama Suyu
  su_kaynatma_switch:
    name: Su Kaynatma
  # Filtre kahve (tuş 2): çay demlemeyle aynı düzenek; su bitince 2 dk sonra hazır, 40 dk tazelik.
  filtre_kahve_switch:
    name: Filtre Kahve
  cay_demleme:
    name: "Çay Demleme"
  buton_sesi_switch: buton_sesi
  konusma_sesi_switch: konusma_sesi
  su_kontrol_switch: su_kontrol
  # İsteğe bağlı — fabrika yazılımındaki düzen (docs/fabrika-yazilimi.md):
  # Demleme, üst haznedeki su bitince biter (GPIO34 girişinden algılanır); su bittikten 15 dk sonra "çay demlendi".
  # Anahtar kapalıysa ya da girişte işaret görülmezse demleme seçilen seviyenin süresiyle yürür (eski düzen).
  su_bitti_algisi_switch: su_bitti_algisi
  demleme_hatti_sensor:
    name: "Demleme Hattı"
  # Mod açıldıktan bu süre sonra cihaz kendini kapatır (fabrikada 2 saat). Verilmezse kapanmaz.
  otomatik_kapanma: 2h
  # Mama suyu "hazır" olduktan sonra modun açık kalacağı süre (verilmezse yalnız otomatik_kapanma geçerli)
  mama_suyu_sicak_tutma: 1h

switch:
  - platform: template
    name: "Buton Sesi"
    id: buton_sesi
    icon: mdi:gesture-tap-button
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  - platform: template
    name: "Konuşma Sesi"
    id: konusma_sesi
    icon: mdi:account-voice
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  - platform: template
    name: "Su Kontrolü"
    id: su_kontrol
    icon: mdi:water-check
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true

  - platform: template
    name: "Su Bitti Algısı"
    id: su_bitti_algisi
    icon: mdi:water-off-outline
    entity_category: diagnostic
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true


sensor:
  - platform: adc
    id: adc_sensor
    pin: GPIO35
    attenuation: 12db
    # Okumaya şebeke uğultusu karışıyor; 2 sn'de bir tek örnek alınınca birkaç °C'lik yavaş bir dalgalanma olarak
    # görünür. 125 ms'de bir örnek alınıp son 15 örneğin ortancası kullanılır: uğultu ve tek tük bozuk örnekler elenir.
    # Bileşene değer yine 2 sn'de bir gelir (16 × 125 ms). Açılıştaki ilk değer de pencere dolunca yayınlanır; tek bir
    # ham örnek hiçbir zaman bileşene ulaşmaz (o âna kadar okuma yoktur, bileşen KORUMA'da bekler).
    update_interval: 125ms
    filters:
      - median:
          window_size: 15
          send_every: 16
          send_first_at: 16
  - platform: resistance
    sensor: adc_sensor
    configuration: DOWNSTREAM  # Sabit direnç aşağı yönlü bağlandı
    resistor: 10000
    id: resistance_sensor
  - platform: ntc
    sensor: resistance_sensor
    name: "NTC Sıcaklık"
    calibration:
      b_constant: 3950
      reference_temperature: 25°C
      reference_resistance: 34000
    id: ntc_temperature

# İsteğe bağlı tanılama: ses çipindeki klipleri su kaynatmadan dener. Ses anahtarlarına bakmaz, ısıtıcıya dokunmaz.
# Maske: 1 = GPIO4, 2 = GPIO19, 4 = GPIO32 (toplanır). 5 = bip, 4 = "su kaynadı", 1 = demleme başlıyor,
# 3 = çay demlendi, 2 ve 6 = filtre kahve, 7 = mama suyu hazır.
